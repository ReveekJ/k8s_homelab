---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ReveekJ/k8s_homelab.git
    targetRevision: main
    path: gitops/apps
    directory:
      recurse: true
      exclude: >-
        {**/chart/**,**/templates/**,**/charts/**,**/secret-*.yaml,kustomization.yaml,*.md}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
