---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nextcloud
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/ReveekJ/k8s_homelab.git
      targetRevision: main
      path: gitops/apps/nextcloud/chart
      helm:
        releaseName: nextcloud
        valueFiles:
          - $values/gitops/charts/cluster/values.yaml
          - values.yaml
    - repoURL: https://github.com/ReveekJ/k8s_homelab.git
      targetRevision: main
      path: gitops/apps/nextcloud
      kustomize: {}
    - repoURL: https://github.com/ReveekJ/k8s_homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: nextcloud
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true