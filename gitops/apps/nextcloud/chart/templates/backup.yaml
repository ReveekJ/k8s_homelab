{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-backup
  labels:
    {{- include "nextcloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: nextcloud
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            {{- toYaml .Values.nodeSelector | nindent 12 }}
          tolerations:
            {{- toYaml .Values.tolerations | nindent 12 }}
          containers:
            - name: backup
              image: {{ .Values.postgres.image | quote }}
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  timestamp="$(date +%Y%m%d-%H%M%S)"
                  backup_dir="{{ .Values.backup.mountPath }}"
                  mkdir -p "$backup_dir"
                  pg_dump --clean --if-exists --no-owner --no-privileges \
                    -h nextcloud-postgres -U "$POSTGRES_USER" "$POSTGRES_DB" \
                    | gzip > "$backup_dir/postgres-$timestamp.sql.gz"
                  tar -czf "$backup_dir/nextcloud-config-data-$timestamp.tar.gz" \
                    -C /backup-source config data
                  find "$backup_dir" -type f -mtime +{{ .Values.backup.retentionDays }} -delete
              env:
                - name: PGHOST
                  value: nextcloud-postgres
                - name: PGUSER
                  value: {{ .Values.postgres.user | quote }}
                - name: POSTGRES_USER
                  value: {{ .Values.postgres.user | quote }}
                - name: POSTGRES_DB
                  value: {{ .Values.postgres.database | quote }}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secretName }}
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: backup
                  mountPath: {{ .Values.backup.mountPath }}
                - name: nextcloud
                  mountPath: /backup-source
                  readOnly: true
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
          volumes:
            - name: backup
              hostPath:
                path: {{ .Values.backup.hostPath }}
                type: Directory
            - name: nextcloud
              hostPath:
                path: /mnt/hub_drive_2/nextcloud
                type: Directory
{{- end }}