apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  labels:
    {{- include "nextcloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nextcloud
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nextcloud
        app.kubernetes.io/component: web
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: nextcloud
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: POSTGRES_HOST
              value: nextcloud-postgres
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: POSTGRES_PASSWORD
            - name: REDIS_HOST
              value: nextcloud-redis
            - name: REDIS_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: REDIS_PASSWORD
            - name: NEXTCLOUD_TRUSTED_DOMAINS
              value: {{ join " " .Values.nextcloud.trustedDomains | quote }}
            - name: OVERWRITEPROTOCOL
              value: https
            - name: OVERWRITECLIURL
              value: {{ .Values.nextcloud.overwriteCliUrl | quote }}
            - name: PHP_MEMORY_LIMIT
              value: 512M
            - name: PHP_UPLOAD_LIMIT
              value: 10G
          ports:
            - name: http
              containerPort: {{ .Values.nextcloud.port }}
          volumeMounts:
            - name: nextcloud-config
              mountPath: /var/www/html/config
            - name: nextcloud-data
              mountPath: /var/www/html/data
            - name: external-storage
              mountPath: {{ .Values.nextcloud.externalStorageMountPath }}
          resources:
            {{- toYaml .Values.nextcloud.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /status.php
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /status.php
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /status.php
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: nextcloud-config
          hostPath:
            path: {{ .Values.nextcloud.configHostPath }}
            type: Directory
        - name: nextcloud-data
          hostPath:
            path: {{ .Values.nextcloud.hostPath }}
            type: Directory
        - name: external-storage
          hostPath:
            path: {{ .Values.nextcloud.externalStorageHostPath }}
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud
  labels:
    {{- include "nextcloud.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.nextcloud.port }}
      targetPort: http
