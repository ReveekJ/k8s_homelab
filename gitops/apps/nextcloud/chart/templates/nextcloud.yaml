apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  labels:
    {{- include "nextcloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nextcloud
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nextcloud
        app.kubernetes.io/component: web
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: nextcloud
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: POSTGRES_HOST
              value: nextcloud-postgres
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: POSTGRES_PASSWORD
            - name: REDIS_HOST
              value: nextcloud-redis
            - name: REDIS_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: REDIS_PASSWORD
            - name: PHP_MEMORY_LIMIT
              value: 512M
            - name: PHP_UPLOAD_LIMIT
              value: 10G
          ports:
            - name: http
              containerPort: {{ .Values.nextcloud.port }}
          volumeMounts:
            - name: nextcloud-code
              mountPath: /var/www/html
            - name: nextcloud-config
              mountPath: /var/www/html/config
            - name: k8s-config
              mountPath: /var/www/html/config/k8s.config.php
              subPath: k8s.config.php
              readOnly: true
            - name: nextcloud-custom-apps
              mountPath: /var/www/html/custom_apps
            - name: nextcloud-data
              mountPath: {{ .Values.nextcloud.dataMountPath }}
          resources:
            {{- toYaml .Values.nextcloud.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /status.php
              port: http
              httpHeaders:
                - name: Host
                  value: {{ .Values.ingress.host }}
            timeoutSeconds: 5
            # The first start or an image upgrade copies 2.5 GiB of code.
            failureThreshold: 120
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /status.php
              port: http
              httpHeaders:
                - name: Host
                  value: {{ .Values.ingress.host }}
            timeoutSeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /status.php
              port: http
              httpHeaders:
                - name: Host
                  value: {{ .Values.ingress.host }}
            timeoutSeconds: 5
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: nextcloud-code
          persistentVolumeClaim:
            claimName: nextcloud-code
        - name: nextcloud-config
          hostPath:
            path: {{ .Values.nextcloud.configHostPath }}
            type: Directory
        - name: k8s-config
          configMap:
            name: nextcloud-config
        - name: nextcloud-custom-apps
          hostPath:
            path: {{ .Values.nextcloud.customAppsHostPath }}
            type: Directory
        - name: nextcloud-data
          hostPath:
            path: {{ .Values.nextcloud.hostPath }}
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud
  labels:
    {{- include "nextcloud.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.nextcloud.port }}
      targetPort: http
