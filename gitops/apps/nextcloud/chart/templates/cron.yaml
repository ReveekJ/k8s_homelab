{{- if .Values.cron.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-cron
  labels:
    {{- include "nextcloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: cron
spec:
  schedule: {{ .Values.cron.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 240
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: nextcloud
            app.kubernetes.io/component: cron
          annotations:
            checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            {{- toYaml .Values.nodeSelector | nindent 12 }}
          tolerations:
            {{- toYaml .Values.tolerations | nindent 12 }}
          containers:
            - name: cron
              image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              # Bypasses the entrypoint: the code is already on the nextcloud-code volume.
              command:
                - php
                - -f
                - /var/www/html/cron.php
              securityContext:
                runAsUser: 33
                runAsGroup: 33
              env:
                - name: POSTGRES_HOST
                  value: nextcloud-postgres
                - name: POSTGRES_DB
                  value: {{ .Values.postgres.database | quote }}
                - name: POSTGRES_USER
                  value: {{ .Values.postgres.user | quote }}
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secretName }}
                      key: POSTGRES_PASSWORD
                - name: REDIS_HOST
                  value: nextcloud-redis
                - name: REDIS_HOST_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secretName }}
                      key: REDIS_PASSWORD
              volumeMounts:
                - name: nextcloud-code
                  mountPath: /var/www/html
                - name: nextcloud-config
                  mountPath: /var/www/html/config
                - name: k8s-config
                  mountPath: /var/www/html/config/k8s.config.php
                  subPath: k8s.config.php
                  readOnly: true
                - name: nextcloud-custom-apps
                  mountPath: /var/www/html/custom_apps
                - name: nextcloud-data
                  mountPath: {{ .Values.nextcloud.dataMountPath }}
              resources:
                {{- toYaml .Values.cron.resources | nindent 16 }}
          volumes:
            - name: nextcloud-code
              persistentVolumeClaim:
                claimName: nextcloud-code
            - name: nextcloud-config
              hostPath:
                path: {{ .Values.nextcloud.configHostPath }}
                type: Directory
            - name: k8s-config
              configMap:
                name: nextcloud-config
            - name: nextcloud-custom-apps
              hostPath:
                path: {{ .Values.nextcloud.customAppsHostPath }}
                type: Directory
            - name: nextcloud-data
              hostPath:
                path: {{ .Values.nextcloud.hostPath }}
                type: Directory
{{- end }}