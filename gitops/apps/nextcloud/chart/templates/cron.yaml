{{- if .Values.cron.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-cron
  labels:
    {{- include "nextcloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: cron
spec:
  schedule: {{ .Values.cron.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: nextcloud
            app.kubernetes.io/component: cron
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            {{- toYaml .Values.nodeSelector | nindent 12 }}
          tolerations:
            {{- toYaml .Values.tolerations | nindent 12 }}
          containers:
            - name: cron
              image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["/bin/sh", "-c"]
              args:
                - exec su -s /bin/sh www-data -c 'php -f /var/www/html/cron.php'
              env:
                - name: POSTGRES_HOST
                  value: nextcloud-postgres
                - name: POSTGRES_DB
                  value: {{ .Values.postgres.database | quote }}
                - name: POSTGRES_USER
                  value: {{ .Values.postgres.user | quote }}
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secretName }}
                      key: POSTGRES_PASSWORD
                - name: REDIS_HOST
                  value: nextcloud-redis
                - name: REDIS_HOST_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secretName }}
                      key: REDIS_PASSWORD
              volumeMounts:
                - name: nextcloud-config
                  mountPath: /var/www/html/config
                - name: nextcloud-data
                  mountPath: /var/www/html/data
                - name: external-storage
                  mountPath: {{ .Values.nextcloud.externalStorageMountPath }}
              resources:
                {{- toYaml .Values.cron.resources | nindent 16 }}
          volumes:
            - name: nextcloud-config
              hostPath:
                path: {{ .Values.nextcloud.configHostPath }}
                type: Directory
            - name: nextcloud-data
              hostPath:
                path: {{ .Values.nextcloud.hostPath }}
                type: Directory
            - name: external-storage
              hostPath:
                path: {{ .Values.nextcloud.externalStorageHostPath }}
                type: Directory
{{- end }}