nameOverride: nextcloud
fullnameOverride: nextcloud

image:
  repository: nextcloud
  tag: "33.0.8-apache"
  pullPolicy: IfNotPresent

secretName: nextcloud-secrets

nodeSelector:
  kubernetes.io/hostname: debian-hp

tolerations:
  - key: homelab.reveek.io/node-role
    operator: Equal
    value: application
    effect: NoSchedule

postgres:
  image: postgres:18-alpine
  port: 5432
  database: nextcloud
  user: nextcloud
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  persistence:
    storageClass: local-path
    size: 10Gi

redis:
  image: redis:7-alpine
  port: 6379
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi
  persistence:
    storageClass: local-path
    size: 1Gi

nextcloud:
  port: 80
  hostPath: /mnt/hub_drive_2/nextcloud/data
  dataMountPath: /mnt/ncdata
  configHostPath: /mnt/hub_drive_2/nextcloud/config
  customAppsHostPath: /mnt/hub_drive_2/nextcloud/custom_apps
  # Keeps the code unpacked by the image entrypoint, so restarts and cron skip that copy.
  codePersistence:
    storageClass: local-path
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  trustedDomains:
    - nextcloud.reveek-io.ru
  trustedProxies:
    - 10.42.0.0/16
  overwriteCliUrl: https://nextcloud.reveek-io.ru

cron:
  enabled: true
  schedule: "*/5 * * * *"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

backup:
  enabled: true
  schedule: "30 3 * * *"
  hostPath: /mnt/hub_drive_2/nextcloud-backups
  mountPath: /backup
  retentionDays: 14
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  mirror:
    # Overwrites the AIO data in /mnt/ncdata, which ends the rollback window.
    enabled: false
    schedule: "30 4 * * *"
    dataHostPath: /mnt/ncdata
    configHostPath: /mnt/nextcloud-config-mirror
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 512Mi

ingress:
  className: traefik
  clusterIssuer: letsencrypt
  host: nextcloud.reveek-io.ru
  tlsSecretName: nextcloud-tls
