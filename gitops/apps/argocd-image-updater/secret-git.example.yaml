  name: argocd-image-updater-git
  namespace: argocd
  labels:
    argocd-image-updater.argoproj.io/secret-type: git
type: Opaque
stringData:
  username: GITHUB_DEPLOY_KEY_USERNAME
  sshPrivateKey: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    REPLACE_WITH_PRIVATE_KEY
    -----END OPENSSH PRIVATE KEY-----