apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  template:
    spec:
      initContainers:
        - name: install-ksops
          image: viaductoss/ksops:v4.3.2
          command: ["/bin/sh", "-c"]
          args: ["mkdir -p /custom-tools/config/kustomize/plugin/viaduct.ai/v1/ksops && cp /usr/local/bin/ksops /custom-tools/config/kustomize/plugin/viaduct.ai/v1/ksops/ksops"]
          volumeMounts:
            - name: custom-tools
              mountPath: /custom-tools
      volumes:
        - name: custom-tools
          emptyDir: {}
        - name: sops-age-key
          secret:
            secretName: sops-age-key
      containers:
        - name: argocd-repo-server
          env:
            - name: PATH
              value: /custom-tools/config/kustomize/plugin/viaduct.ai/v1/ksops:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: SOPS_AGE_KEY_FILE
              value: /etc/age-key/key.txt
            - name: XDG_CONFIG_HOME
              value: /custom-tools/config
          volumeMounts:
            - name: custom-tools
              mountPath: /custom-tools
            - name: sops-age-key
              mountPath: /etc/age-key
              readOnly: true
