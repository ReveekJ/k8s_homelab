apiVersion: v1
kind: Service
metadata:
  name: artspletni-frontend
  labels:
    {{- include "artspletni.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/name: artspletni
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: artspletni-backend
  labels:
    {{- include "artspletni.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: artspletni
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: artspletni-postgres
  labels:
    {{- include "artspletni.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  selector:
    app.kubernetes.io/name: artspletni
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: artspletni-minio
  labels:
    {{- include "artspletni.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  selector:
    app.kubernetes.io/name: artspletni
    app.kubernetes.io/component: minio
  ports:
    - name: api
      port: {{ .Values.minio.apiPort }}
      targetPort: api
    - name: console
      port: {{ .Values.minio.consolePort }}
      targetPort: console
