apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: artspletni
  namespace: argocd
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ReveekJ/k8s_homelab.git
    targetRevision: main
    path: gitops/apps/artspletni/chart
    helm:
      releaseName: artspletni
  destination:
    server: https://kubernetes.default.svc
    namespace: artspletni
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true