apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: artspletni
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: >-
      backend=reg.reveek-io.ru/artspletni-backend,
      frontend=reg.reveek-io.ru/artspletni-frontend
    argocd-image-updater.argoproj.io/backend.update-strategy: newest-build
    argocd-image-updater.argoproj.io/frontend.update-strategy: newest-build
    argocd-image-updater.argoproj.io/backend.helm.image-name: image.backend.repository
    argocd-image-updater.argoproj.io/backend.helm.image-tag: image.backend.tag
    argocd-image-updater.argoproj.io/frontend.helm.image-name: image.frontend.repository
    argocd-image-updater.argoproj.io/frontend.helm.image-tag: image.frontend.tag
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/argocd-image-updater-git
    argocd-image-updater.argoproj.io/write-back-target: helmvalues:gitops/apps/artspletni/chart/values.yaml
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/ReveekJ/k8s_homelab.git
      targetRevision: main
      path: gitops/apps/artspletni/chart
      helm:
        releaseName: artspletni
        valueFiles:
          - $values/gitops/charts/cluster/values.yaml
          - values.yaml
    - repoURL: https://github.com/ReveekJ/k8s_homelab.git
      targetRevision: main
      path: gitops/apps/artspletni
      kustomize: {}
    - repoURL: https://github.com/ReveekJ/k8s_homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: artspletni
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
