---
docker-registry:
  fullnameOverride: registry
  image:
    tag: 3.0.0
  configPath: /etc/distribution
  persistence:
    enabled: true
    size: 20Gi
    storageClass: local-path
  nodeSelector:
    kubernetes.io/hostname: debian-hp
  tolerations:
    - key: homelab.reveek.io/node-role
      operator: Equal
      value: application
      effect: NoSchedule
  ingress:
    enabled: false
  secrets:
    htpasswd: ""
  extraEnvVars:
    - name: REGISTRY_AUTH
      value: htpasswd
    - name: REGISTRY_AUTH_HTPASSWD_REALM
      value: Registry Realm
    - name: REGISTRY_AUTH_HTPASSWD_PATH
      value: /auth/htpasswd
  extraSecretMounts:
    - name: auth
      secretName: registry-auth
      path: /auth
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  configData:
    headers:
      X-Content-Type-Options: [nosniff]

ingress:
  className: traefik
  clusterIssuer: letsencrypt
  tlsSecretName: registry-tls
