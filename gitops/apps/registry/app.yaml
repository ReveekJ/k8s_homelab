---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: registry
  namespace: argocd
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/ReveekJ/k8s_homelab.git
      targetRevision: main
      path: gitops/apps/registry/chart
      helm:
        releaseName: registry
        valueFiles:
          - $values/gitops/charts/cluster/values.yaml
          - values.yaml
    - repoURL: https://github.com/ReveekJ/k8s_homelab.git
      targetRevision: main
      path: gitops/apps/registry
      kustomize: {}
    - repoURL: https://github.com/ReveekJ/k8s_homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: registry
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
