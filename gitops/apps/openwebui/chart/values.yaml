image:
  repository: ghcr.io/open-webui/open-webui
  tag: v0.6.46
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  port: 8080

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi

ingress:
  enabled: true
  className: traefik
  host: openwebui.reveek-io.ru
  clusterIssuer: letsencrypt
  tlsSecretName: openwebui-tls

persistence:
  enabled: true
  storageClass: local-path
  size: 20Gi

nodeSelector:
  kubernetes.io/hostname: debian-hp

tolerations:
  - key: homelab.reveek.io/node-role
    operator: Equal
    value: application
    effect: NoSchedule