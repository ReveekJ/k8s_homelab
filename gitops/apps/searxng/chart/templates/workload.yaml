apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  labels:
    {{- include "searxng.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: searxng
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: GRANIAN_WORKERS
              value: {{ .Values.workers | quote }}
            - name: SEARXNG_BASE_URL
              value: {{ .Values.config.baseUrl | quote }}
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: SEARXNG_SECRET
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng
            - name: data
              mountPath: /var/cache/searxng
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: settings
          configMap:
            name: searxng-settings
        - name: data
          persistentVolumeClaim:
            claimName: searxng
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: searxng
  labels:
    {{- include "searxng.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
