# Placement decision: runs on the worker next to its data sources and keeps its
# SQLite database off the master's eMMC.
nodeSelector:
  kubernetes.io/hostname: debian-hp
tolerations:
  - key: homelab.reveek.io/node-role
    operator: Equal
    value: application
    effect: NoSchedule
priorityClassName: monitoring-low

admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

# The binary is paged in from a busy HDD, so the first start can take many minutes.
startupProbe:
  httpGet:
    path: /api/health
    port: grafana
  periodSeconds: 10
  failureThreshold: 90
livenessProbe:
  httpGet:
    path: /api/health
    port: grafana
  timeoutSeconds: 30
  failureThreshold: 10

testFramework:
  enabled: false
initChownData:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: "1"
    memory: 320Mi
env:
  GOMEMLIMIT: 272MiB

persistence:
  enabled: true
  type: pvc
  storageClassName: local-path
  size: 1Gi

grafana.ini:
  server:
    root_url: https://grafana.reveek-io.ru
  analytics:
    reporting_enabled: false
    check_for_updates: false
  users:
    allow_sign_up: false
  auth.anonymous:
    enabled: false
  security:
    cookie_secure: true
  # Each bundled data source runs as its own process. Grafana peaks above 360 MiB
  # with all of them, so only Prometheus, Loki and Logs Drilldown stay enabled.
  plugins:
    disable_plugins: cloudwatch,elasticsearch,grafana-azure-monitor-datasource,grafana-postgresql-datasource,grafana-pyroscope-datasource,graphite,influxdb,jaeger,mssql,mysql,opentsdb,parca,stackdriver,tempo,zipkin,grafana-testdata-datasource,grafana-pyroscope-app,grafana-exploretraces-app,grafana-metricsdrilldown-app
  log:
    level: warn
  # Unified Alerting is on but has no rules or contact points yet. Add them later
  # as provisioning files through the chart's `alerting` value.
  unified_alerting:
    enabled: true

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        jsonData:
          timeInterval: 30s
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
        jsonData:
          maxLines: 1000

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: homelab
        orgId: 1
        folder: Homelab
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards/homelab

dashboardsConfigMaps:
  homelab: grafana-dashboards
