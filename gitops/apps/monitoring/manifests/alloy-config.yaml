apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy
data:
  config.alloy: |
    prometheus.exporter.unix "node" {
      procfs = "/host/proc"
      sysfs = "/host/sys"
      rootfs = "/host/root"
      set_collectors = ["cpu", "filesystem", "loadavg", "meminfo", "netdev", "stat", "time", "uname"]
    }

    prometheus.remote_write "default" {
      endpoint {
        url = "http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090/api/v1/write"
      }
    }

    prometheus.scrape "node" {
      targets    = prometheus.exporter.unix.node.targets
      forward_to = [prometheus.relabel.node.receiver]
      job_name   = "node-exporter"
    }

    prometheus.relabel "node" {
      forward_to = [prometheus.remote_write.default.receiver]

      rule {
        target_label = "node"
        replacement   = sys.env("NODE_NAME")
        action        = "replace"
      }
    }