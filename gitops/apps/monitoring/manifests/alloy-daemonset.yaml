# Placement decision: Alloy collects host metrics and logs, so it runs on both
# nodes. This is why it carries the application toleration despite being a system
# component. It has no nodeSelector for the same reason.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  labels:
    app.kubernetes.io/name: alloy
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
    spec:
      serviceAccountName: alloy
      priorityClassName: monitoring-low
      # Host network and PID namespaces make the node exporter report the real
      # NICs and mounts instead of those of the pod.
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: alloy
          image: grafana/alloy:v1.21.3
          args:
            - run
            - /etc/alloy/config.alloy
            - --server.http.listen-addr=127.0.0.1:12345
            - --storage.path=/var/lib/alloy/data
            - --disable-reporting
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: GOMEMLIMIT
              value: 170MiB
          readinessProbe:
            httpGet:
              host: 127.0.0.1
              path: /-/ready
              port: 12345
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 200Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: storage
              mountPath: /var/lib/alloy
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            # HostToContainer keeps disks mounted after the pod start visible.
            - name: root
              mountPath: /host/root
              mountPropagation: HostToContainer
              readOnly: true
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: journal
              mountPath: /var/log/journal
              readOnly: true
            - name: machine-id
              mountPath: /etc/machine-id
              readOnly: true
      tolerations:
        - key: homelab.reveek.io/node-role
          operator: Equal
          value: application
          effect: NoSchedule
      volumes:
        - name: config
          configMap:
            name: alloy
        # Kept on the host so WAL and log positions survive pod replacement.
        - name: storage
          hostPath:
            path: /var/lib/alloy
            type: DirectoryOrCreate
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: root
          hostPath:
            path: /
        - name: pod-logs
          hostPath:
            path: /var/log/pods
        - name: journal
          hostPath:
            path: /var/log/journal
        - name: machine-id
          hostPath:
            path: /etc/machine-id
            type: File
