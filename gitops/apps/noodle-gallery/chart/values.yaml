image:
  server:
    repository: ghcr.io/open-noodle/gallery-server
    tag: v5
    pullPolicy: IfNotPresent
  machineLearning:
    repository: ghcr.io/open-noodle/gallery-ml
    tag: v5
    pullPolicy: IfNotPresent
  redis:
    repository: redis
    tag: "7"
    pullPolicy: IfNotPresent
  database:
    repository: ghcr.io/immich-app/postgres
    digest: sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    pullPolicy: IfNotPresent

secretName: noodle-gallery-secrets
timezone: Europe/Moscow
nodeSelector:
  kubernetes.io/hostname: debian-hp

tolerations:
  - key: homelab.reveek.io/node-role
    operator: Equal
    value: application
    effect: NoSchedule

server:
  replicas: 0
  port: 2283
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

machineLearning:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 2Gi

redis:
  port: 6379

database:
  port: 5432
  name: immich
  user: postgres
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "2"
      memory: 1Gi

persistence:
  databaseSize: 50Gi
  database:
    hostPath: /mnt/hub_drive_2/noodle-db
  library:
    hostPath: /mnt/hub_drive_2/noodle
    size: 900Gi
  backup:
    hostPath: /mnt/hub_drive_2/immich/library

ingress:
  enabled: true
  host: noodle.reveek-io.ru
  className: traefik
  clusterIssuer: letsencrypt
  tlsSecretName: noodle-tls