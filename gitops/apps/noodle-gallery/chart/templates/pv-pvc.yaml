apiVersion: v1
kind: PersistentVolume
metadata:
  name: noodle-gallery-library
  labels:
    {{- include "noodle-gallery.labels" . | nindent 4 }}
spec:
  capacity:
    storage: {{ .Values.persistence.library.size }}
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: noodle-gallery-local
  local:
    path: {{ .Values.persistence.library.hostPath }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - {{ index .Values.nodeSelector "kubernetes.io/hostname" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: noodle-gallery-library
  labels:
    {{- include "noodle-gallery.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: noodle-gallery-local
  volumeName: noodle-gallery-library
  resources:
    requests:
      storage: {{ .Values.persistence.library.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: noodle-gallery-database
  labels:
    {{- include "noodle-gallery.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.databaseSize }}