apiVersion: apps/v1
kind: Deployment
metadata:
  name: noodle-gallery-machine-learning
  labels:
    {{- include "noodle-gallery.labels" . | nindent 4 }}
    app.kubernetes.io/component: machine-learning
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: noodle-gallery
      app.kubernetes.io/component: machine-learning
  template:
    metadata:
      labels:
        app.kubernetes.io/name: noodle-gallery
        app.kubernetes.io/component: machine-learning
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: machine-learning
          image: {{ include "noodle-gallery.mlImage" . | quote }}
          imagePullPolicy: {{ .Values.image.machineLearning.pullPolicy }}
          env:
            - name: DEVICE
              value: cpu
            - name: TZ
              value: {{ .Values.timezone | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.machineLearning.port }}
          volumeMounts:
            - name: model-cache
              mountPath: /cache
          resources:
            {{- toYaml .Values.machineLearning.resources | nindent 12 }}
      volumes:
        - name: model-cache
          emptyDir: {}