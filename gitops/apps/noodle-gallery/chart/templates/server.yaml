apiVersion: apps/v1
kind: Deployment
metadata:
  name: noodle-gallery
  labels:
    {{- include "noodle-gallery.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: noodle-gallery
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: noodle-gallery
        app.kubernetes.io/component: server
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      initContainers:
        - name: initialize-storage
          image: {{ include "noodle-gallery.serverImage" . | quote }}
          imagePullPolicy: {{ .Values.image.server.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - >-
              for directory in upload thumbs encoded-video backups profile library; do
              mkdir -p "/usr/src/app/upload/${directory}" && touch "/usr/src/app/upload/${directory}/.immich" || exit 1;
              done
          volumeMounts:
            - name: library
              mountPath: /usr/src/app/upload
      containers:
        - name: server
          image: {{ include "noodle-gallery.serverImage" . | quote }}
          imagePullPolicy: {{ .Values.image.server.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          env:
            - name: TZ
              value: {{ .Values.timezone | quote }}
            - name: DB_HOSTNAME
              value: noodle-gallery-database
            - name: DB_PORT
              value: {{ .Values.database.port | quote }}
            - name: DB_USERNAME
              value: {{ .Values.database.user | quote }}
            - name: DB_DATABASE_NAME
              value: {{ .Values.database.name | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: DB_PASSWORD
            - name: REDIS_HOSTNAME
              value: noodle-gallery-redis
            - name: IMMICH_MACHINE_LEARNING_URL
              value: "http://noodle-gallery-machine-learning:{{ .Values.machineLearning.port }}"
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
          volumeMounts:
            - name: library
              mountPath: /usr/src/app/upload
            - name: backup
              mountPath: /mnt/backup
              readOnly: true
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: noodle-gallery-library-noodle
        - name: backup
          hostPath:
            path: {{ .Values.persistence.backup.hostPath }}
            type: Directory