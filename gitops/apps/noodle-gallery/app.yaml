apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: noodle-gallery
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/ReveekJ/k8s_homelab.git
      targetRevision: main
      path: gitops/apps/noodle-gallery/chart
      helm:
        valueFiles:
          - values.yaml
    - repoURL: https://github.com/ReveekJ/k8s_homelab.git
      targetRevision: main
      path: gitops/apps/noodle-gallery
      kustomize: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: noodle-gallery
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true