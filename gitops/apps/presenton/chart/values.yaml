image:
  repository: ghcr.io/presenton/presenton
  tag: latest
  pullPolicy: Always

replicaCount: 1

service:
  port: 5001
  targetPort: 80

ingress:
  enabled: true
  className: traefik
  clusterIssuer: letsencrypt
  host: presenton.reveek-io.ru
  tlsSecretName: presenton-tls

persistence:
  enabled: true
  storageClass: local-path
  size: 20Gi
  mountPath: /app_data

auth:
  secretName: presenton-auth

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 2Gi

nodeSelector:
  kubernetes.io/hostname: debian-hp

tolerations:
  - key: homelab.reveek.io/node-role
    operator: Equal
    value: application
    effect: NoSchedule

env:
  MIGRATE_DATABASE_ON_STARTUP: "false"
