image:
  repository: ghcr.io/presenton/presenton
  tag: latest
  pullPolicy: Always

replicaCount: 1

service:
  port: 5001
  targetPort: 80

ingress:
  enabled: true
  className: traefik
  clusterIssuer: letsencrypt
  host: presenton.reveek-io.ru
  tlsSecretName: presenton-tls

persistence:
  enabled: true
  storageClass: local-path
  size: 20Gi
  mountPath: /app_data

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

nodeSelector:
  kubernetes.io/hostname: debian-hp

tolerations:
  - key: homelab.reveek.io/node-role
    operator: Equal
    value: application
    effect: NoSchedule

env: {}
