apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: winner
  namespace: argocd
  finalizers:
    - resources-finalizer.argoproj.io
  source:
    repoURL: https://github.com/ReveekJ/k8s_homelab.git
    targetRevision: main
    path: gitops/apps/winner/chart
    helm:
      releaseName: winner
  destination:
    server: https://kubernetes.default.svc
    namespace: winner
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true