image:
  repository: reg.reveek-io.ru/winner
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

nodeSelector:
  kubernetes.io/hostname: debian-hp

tolerations:
  - key: homelab.reveek.io/node-role
    operator: Equal
    value: application
    effect: NoSchedule

service:
  port: 80

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

ingress:
  enabled: true
  className: traefik
  host: winner.reveek-io.ru
  clusterIssuer: letsencrypt
  tlsSecretName: winner-tls
