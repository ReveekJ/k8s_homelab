---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: actions-runner-controller
  namespace: argocd
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  project: default
  sources:
    # ARC controller: CRDs + controller-manager deployment
    - repoURL: ghcr.io/actions/actions-runner-controller-charts
      chart: gha-runner-scale-set-controller
      targetRevision: 0.14.2
      helm:
        releaseName: arc-controller
        values: |
          metrics:
            controllerManager:
              listener:
                enabled: false
    # Runner scale set: org-scoped ephemeral runners on the worker node
    - repoURL: ghcr.io/actions/actions-runner-controller-charts
      chart: gha-runner-scale-set
      targetRevision: 0.14.2
      helm:
        releaseName: arc-runners
        values: |
          githubConfigUrl: https://github.com/ReveekJ
          githubConfigSecret: controller-manager
          controllerServiceAccount:
            name: arc-controller-gha-rs-controller
            namespace: actions-runner-system
          maxRunners: 4
          minRunners: 0
          containerMode:
            type: kubernetes
            kubernetesModeWorkVolumeClaim:
              accessModes: ["ReadWriteOnce"]
              storageClassName: local-path
              resources:
                requests:
                  storage: 1Gi
          template:
            spec:
              nodeSelector:
                kubernetes.io/hostname: debian-hp
              containers:
                - name: runner
                  image: ghcr.io/actions/actions-runner:latest
                  command: ["/home/runner/run.sh"]
          listenerTemplate:
            spec:
              nodeSelector:
                kubernetes.io/hostname: debian-hp
    # SOPS-encrypted GitHub App credentials for the controller and listeners
    - repoURL: https://github.com/ReveekJ/k8s_homelab.git
      targetRevision: main
      path: gitops/apps/actions-runner-controller
      kustomize: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: actions-runner-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
