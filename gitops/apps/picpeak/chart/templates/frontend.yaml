apiVersion: apps/v1
kind: Deployment
metadata:
  name: picpeak-frontend
  labels:
    {{- include "picpeak.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: picpeak
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: picpeak
        app.kubernetes.io/component: frontend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: frontend
          image: {{ include "picpeak.image" .Values.image.frontend | quote }}
          imagePullPolicy: {{ .Values.image.frontend.pullPolicy }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command: ["/bin/sh", "-c"]
          args:
            - >-
              sed -i 's/resolver [0-9.]* valid=10s ipv6=off;/resolver {{ .Values.frontend.resolver }} valid=10s ipv6=off;/' /etc/nginx/conf.d/default.conf;
              sed -i 's/set $backend_upstream backend;/set $backend_upstream {{ .Values.backend.host }};/g' /etc/nginx/conf.d/default.conf;
              exec nginx -g 'daemon off;'
          env:
            - name: BRAND_TITLE
              value: {{ .Values.application.brandTitle | quote }}
            - name: BRAND_DESCRIPTION
              value: {{ .Values.application.brandDescription | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
