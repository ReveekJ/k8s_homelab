---
# Public domain used for ingress hosts (registry, hermes, argocd).
homelab_domain: example.com

# Public git repository URL Argo CD pulls this repository from.
gitops_repo_url: "git@github.com:example/k8s_homelab.git"
gitops_repo_revision: main
gitops_repo_path: gitops

k3s_version: "v1.36.4+k3s1"
k3s_api_port: 6443

# Node placement for workloads with local-path persistent volumes.
registry_pvc_size: 20Gi
hermes_pvc_size: 20Gi
