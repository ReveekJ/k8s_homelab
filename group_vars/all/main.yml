---
# SSH private key used to connect to all cluster nodes.
ansible_ssh_private_key_file: ~/.ssh/id_rsa/homelab

# Public git repository URL Argo CD pulls this repository from.
gitops_repo_url: "https://github.com/ReveekJ/k8s_homelab.git"
gitops_repo_revision: main
gitops_repo_path: gitops

k3s_version: "v1.36.4+k3s1"
k3s_api_port: 6443
k3s_server_extra_args: "--node-label=homelab.reveek.io/node-role=system"
k3s_worker_extra_args: "--node-label=homelab.reveek.io/node-role=application --node-taint=homelab.reveek.io/node-role=application:NoSchedule"

# Node placement for workloads with local-path persistent volumes.
registry_pvc_size: 20Gi