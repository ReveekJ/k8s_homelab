---
# Copy to group_vars/all/secrets.yml and fill in. Encrypted with ansible-vault.
# Never commit the filled file in plain text.

# Become (sudo) password for the ansible_user on cluster nodes.
ansible_become_password: changeme

# Argo CD admin password (bcrypt hash is generated by the bootstrap playbook).
argocd_admin_password: changeme

# Registry basic auth credentials.
registry_auth_username: changeme
registry_auth_password: changeme

# Hermes model provider API key.
hermes_model_api_key: changeme

# Hermes API server key.
hermes_api_server_key: changeme

# Hermes dashboard basic auth.
hermes_dashboard_basic_auth_username: changeme
hermes_dashboard_basic_auth_password: changeme
hermes_dashboard_basic_auth_secret: changeme
