apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    nodeSelector:
      homelab.reveek.io/node-role: system
    additionalArguments:
      - --entryPoints.websecure.transport.respondingTimeouts.readTimeout=30m
      - --entryPoints.websecure.transport.respondingTimeouts.writeTimeout=30m
      - --entryPoints.websecure.transport.respondingTimeouts.idleTimeout=30m