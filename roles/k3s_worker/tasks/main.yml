---
- name: Install k3s agent
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL {{ k3s_install_script_url }} | \
      INSTALL_K3S_VERSION="{{ k3s_version }}" \
      K3S_URL={{ k3s_server_url }} \
      K3S_TOKEN={{ k3s_join_token }} \
      sh -s - \
      {{ k3s_worker_extra_args }}
  args:
    creates: /usr/local/bin/k3s
  no_log: true
