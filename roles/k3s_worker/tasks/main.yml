---
- name: Install k3s agent
  block:
    - name: Download k3s installer
      ansible.builtin.get_url:
        url: "{{ k3s_install_script_url }}"
        dest: /var/tmp/k3s-install.sh
        mode: "0700"
      environment:
        CURL_IPRESOLVE: "4"

    - name: Run k3s agent installer
      ansible.builtin.shell: |
        set -o pipefail
        /var/tmp/k3s-install.sh {{ k3s_worker_extra_args }}
      args:
        creates: /usr/local/bin/k3s
        executable: /bin/bash
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        K3S_URL: "{{ k3s_server_url }}"
        K3S_TOKEN: "{{ hostvars[groups['k3s_master'][0]].k3s_node_token_raw.content | b64decode | trim }}"
      no_log: true
  always:
    - name: Remove k3s installer
      ansible.builtin.file:
        path: /var/tmp/k3s-install.sh
        state: absent

- name: Label worker as application node
  ansible.builtin.command:
    cmd: kubectl label node {{ ansible_hostname }} homelab.reveek.io/node-role=application --overwrite
  delegate_to: "{{ groups['k3s_master'][0] }}"
  register: k3s_worker_label
  changed_when: "'labeled' in k3s_worker_label.stdout or 'annotated' in k3s_worker_label.stdout"

- name: Taint worker for application workloads
  ansible.builtin.command:
    cmd: kubectl taint node {{ ansible_hostname }} homelab.reveek.io/node-role=application:NoSchedule --overwrite
  delegate_to: "{{ groups['k3s_master'][0] }}"
  register: k3s_worker_taint
  changed_when: "'tainted' in k3s_worker_taint.stdout or 'updated' in k3s_worker_taint.stdout"

- name: Configure application data disk in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^UUID={{ k3s_worker_data_disk_uuid }}\s'
    line: "UUID={{ k3s_worker_data_disk_uuid }} {{ k3s_worker_data_disk_path }} ext4 {{ k3s_worker_data_disk_opts }} 0 0"
    state: present
  tags: [storage]

- name: Mount application data disk
  ansible.builtin.systemd:
    name: "{{ k3s_worker_data_disk_path | regex_replace('^/', '') | regex_replace('/', '-') }}.mount"
    state: started
    daemon_reload: true
  tags: [storage]

- name: Create Noodle database directory on application data disk
  ansible.builtin.file:
    path: "{{ k3s_worker_noodle_db_path }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags: [storage]

- name: Keep boot independent of the external NTFS disk
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^UUID={{ k3s_worker_external_disk_uuid }}\s'
    line: "UUID={{ k3s_worker_external_disk_uuid }} {{ k3s_worker_external_disk_path }} ntfs {{ k3s_worker_external_disk_opts }} 0 0"
    state: present
  tags: [storage_external]

# Everything below only disables services. Packages, the VM image and Docker
# volumes stay in place: nextcloud_aio_* volumes are the Nextcloud rollback.
- name: Read legacy VM state
  ansible.builtin.command: virsh domstate {{ k3s_worker_legacy_vm }}
  register: k3s_worker_legacy_vm_state
  changed_when: false
  failed_when: false
  tags: [disable_legacy_services]

- name: Stop legacy VM
  when: k3s_worker_legacy_vm_state.rc == 0
  tags: [disable_legacy_services]
  block:
    - name: Disable legacy VM autostart
      ansible.builtin.command: virsh autostart --disable {{ k3s_worker_legacy_vm }}
      changed_when: true

    - name: Request legacy VM shutdown
      ansible.builtin.command: virsh shutdown {{ k3s_worker_legacy_vm }}
      changed_when: true
      when: "'running' in k3s_worker_legacy_vm_state.stdout"

    - name: Wait for legacy VM to shut down
      ansible.builtin.command: virsh domstate {{ k3s_worker_legacy_vm }}
      register: k3s_worker_legacy_vm_wait
      changed_when: false
      failed_when: false
      until: "'shut off' in k3s_worker_legacy_vm_wait.stdout"
      retries: 12
      delay: 5
      when: "'running' in k3s_worker_legacy_vm_state.stdout"

    # destroy only powers the domain off; its definition and disk are kept.
    - name: Power off legacy VM that ignored shutdown
      ansible.builtin.command: virsh destroy {{ k3s_worker_legacy_vm }}
      changed_when: true
      when:
        - "'running' in k3s_worker_legacy_vm_state.stdout"
        - "'shut off' not in k3s_worker_legacy_vm_wait.stdout"

    - name: Disable legacy VM network autostart
      ansible.builtin.command: virsh net-autostart --disable {{ k3s_worker_legacy_vm_network }}
      changed_when: true

    - name: Stop legacy VM network
      ansible.builtin.command: virsh net-destroy {{ k3s_worker_legacy_vm_network }}
      register: k3s_worker_legacy_net_stop
      changed_when: k3s_worker_legacy_net_stop.rc == 0
      failed_when:
        - k3s_worker_legacy_net_stop.rc != 0
        - "'is not active' not in k3s_worker_legacy_net_stop.stderr"

- name: Stop and disable legacy services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ k3s_worker_legacy_services }}"
  tags: [disable_legacy_services]
