---
- name: Add ansible user to sudo group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: sudo
    append: true

- name: Allow passwordless sudo for ansible user
  ansible.builtin.copy:
    content: "{{ ansible_user }} ALL=(ALL) NOPASSWD: ALL\n"
    dest: "/etc/sudoers.d/{{ ansible_user }}"
    mode: "0440"
    owner: root
    group: root
    validate: "visudo -cf %s"

- name: Ensure temporary directory permissions
  ansible.builtin.file:
    path: /var/tmp
    state: directory
    owner: root
    group: root
    mode: "1777"

- name: Check for interrupted package configuration
  ansible.builtin.command: dpkg --audit
  register: k3s_common_dpkg_audit
  changed_when: false

- name: Complete interrupted package configuration
  ansible.builtin.command: dpkg --configure -a
  when: k3s_common_dpkg_audit.stdout | length > 0

- name: Update package list
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages
  ansible.builtin.apt:
    upgrade: dist
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ k3s_common_packages }}"
    state: present

- name: Install time synchronization service
  ansible.builtin.apt:
    name: systemd-timesyncd
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [ntp]

- name: Enable time synchronization service
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    enabled: true
    state: started
  tags: [ntp]

- name: Ensure systemd logind configuration directory exists
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ignore laptop lid close and disable logind sleep actions
  ansible.builtin.copy:
    content: |
      [Login]
      HandleLidSwitch=ignore
      HandleLidSwitchExternalPower=ignore
      HandleLidSwitchDocked=ignore
      HandleSuspendKey=ignore
      HandleHibernateKey=ignore
      HandlePowerKey=ignore
    dest: "{{ k3s_common_logind_sleep_conf }}"
    mode: "0644"
    owner: root
    group: root
  notify: Restart systemd-logind

- name: Disable systemd sleep and hibernation targets
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: true
  loop:
    - sleep.target
    - suspend.target
    - hibernate.target
    - hybrid-sleep.target

- name: Ensure authorized key for ansible user
  ansible.builtin.copy:
    content: "{{ k3s_common_public_key }}"
    dest: "/home/{{ ansible_user }}/.ssh/authorized_keys"
    mode: "0600"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  when: k3s_common_public_key | length > 0

- name: Ensure sshd hardening config directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    mode: "0755"

- name: Disable SSH password authentication
  ansible.builtin.copy:
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
    dest: "{{ k3s_common_sshd_hardening_conf }}"
    mode: "0644"
    owner: root
    group: root
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Restart sshd

- name: Install connectivity check script
  ansible.builtin.template:
    src: homelab-connectivity-log.sh.j2
    dest: /usr/local/bin/homelab-connectivity-log
    owner: root
    group: root
    mode: "0755"
  tags: [connectivity]

- name: Install connectivity check units
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "/etc/systemd/system/{{ item.name }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - name: homelab-connectivity-log.service
      content: |
        [Unit]
        Description=Log LAN and Kubernetes API reachability

        [Service]
        Type=oneshot
        ExecStart=/usr/local/bin/homelab-connectivity-log
    - name: homelab-connectivity-log.timer
      content: |
        [Unit]
        Description=Run the connectivity check every 30 seconds

        [Timer]
        OnBootSec=30s
        OnUnitActiveSec=30s
        AccuracySec=1s

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  tags: [connectivity]

- name: Enable connectivity check timer
  ansible.builtin.systemd_service:
    name: homelab-connectivity-log.timer
    enabled: true
    state: started
    daemon_reload: true
  tags: [connectivity]

- name: Ensure k3s config drop-in directory exists
  ansible.builtin.file:
    path: "{{ k3s_common_kubelet_config | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [kubelet_memory]

# eviction-hard replaces the k3s defaults, so the disk thresholds are repeated here.
- name: Configure kubelet memory reservation and eviction
  ansible.builtin.copy:
    content: |
      kubelet-arg:
        - "system-reserved=memory={{ k3s_common_kubelet_memory[inventory_hostname].system_reserved }}"
        - "eviction-hard=memory.available<{{ k3s_common_kubelet_memory[inventory_hostname].eviction_hard }},nodefs.available<5%,imagefs.available<5%"
    dest: "{{ k3s_common_kubelet_config }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart k3s
  tags: [kubelet_memory]
