---
- name: Add ansible user to sudo group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: sudo
    append: true

- name: Allow passwordless sudo for ansible user
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    line: "{{ ansible_user }} ALL=(ALL) NOPASSWD: ALL"
    state: present
    validate: "visudo -cf %s"

- name: Update package list
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages
  ansible.builtin.apt:
    upgrade: dist
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ k3s_common_packages }}"
    state: present

- name: Ensure sshd password authentication is disabled
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
    state: present
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Restart sshd

- name: Ensure authorized key for ansible user
  ansible.builtin.copy:
    content: "{{ k3s_common_public_key }}"
    dest: "/home/{{ ansible_user }}/.ssh/authorized_keys"
    mode: "0600"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  when: k3s_common_public_key | length > 0
