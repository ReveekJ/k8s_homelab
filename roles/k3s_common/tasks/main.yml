---
- name: Add ansible user to sudo group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: sudo
    append: true

- name: Allow passwordless sudo for ansible user
  ansible.builtin.copy:
    content: "{{ ansible_user }} ALL=(ALL) NOPASSWD: ALL\n"
    dest: "/etc/sudoers.d/{{ ansible_user }}"
    mode: "0440"
    owner: root
    group: root
    validate: "visudo -cf %s"

- name: Update package list
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages
  ansible.builtin.apt:
    upgrade: dist
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ k3s_common_packages }}"
    state: present

- name: Ensure authorized key for ansible user
  ansible.builtin.copy:
    content: "{{ k3s_common_public_key }}"
    dest: "/home/{{ ansible_user }}/.ssh/authorized_keys"
    mode: "0600"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  when: k3s_common_public_key | length > 0

- name: Ensure sshd hardening config directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    mode: "0755"

- name: Disable SSH password authentication
  ansible.builtin.copy:
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
    dest: "{{ k3s_common_sshd_hardening_conf }}"
    mode: "0644"
    owner: root
    group: root
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Restart sshd
