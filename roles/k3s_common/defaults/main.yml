---
k3s_common_packages:
  - ca-certificates
  - curl
  - git
  - htop
  - mc
  - fish
  - openssh-server
  - sudo

k3s_common_public_key: ""
k3s_common_sshd_hardening_conf: /etc/ssh/sshd_config.d/00-homelab-hardening.conf
k3s_common_logind_sleep_conf: /etc/systemd/logind.conf.d/00-homelab-power.conf
k3s_common_connectivity_gateway: 192.168.1.1
k3s_common_connectivity_api: 192.168.1.10
k3s_common_connectivity_peers:
  master: 192.168.1.7
  worker: 192.168.1.10
k3s_common_kubelet_config: /etc/rancher/k3s/config.yaml.d/10-kubelet-memory.yaml
# k3s sets no memory eviction threshold by default, so without this only the
# kernel OOM killer reacts to memory shortage.
k3s_common_kubelet_memory:
  master:
    system_reserved: 1500Mi
    eviction_hard: 200Mi
  worker:
    system_reserved: 512Mi
    eviction_hard: 300Mi
