---
- name: Restart systemd-logind
  ansible.builtin.systemd_service:
    name: systemd-logind
    state: restarted

- name: Restart sshd
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: Restart k3s
  ansible.builtin.systemd_service:
    name: "{{ 'k3s' if inventory_hostname in groups['k3s_master'] else 'k3s-agent' }}"
    state: restarted
