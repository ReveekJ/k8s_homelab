---
- name: Node preparation
  hosts: k3s_cluster
  gather_facts: true
  become: true
  roles:
    - role: k3s_common

- name: Install k3s server on master node
  hosts: k3s_master
  gather_facts: true
  become: true
  roles:
    - role: k3s_server

- name: Join worker node to the cluster
  hosts: k3s_worker
  gather_facts: true
  become: true
  roles:
    - role: k3s_worker
